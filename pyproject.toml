[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imdb-plex-cloud"
version = "0.1.0"
description = "Import IMDb personal ratings into your online Plex account"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["PlexAPI>=4.17,<5"]

[project.scripts]
imdb-plex-cloud = "imdb_plex_cloud.cli:main"

[tool.setuptools.packages.find]
include = ["imdb_plex_cloud*"]
